name: Direct native build qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plpt-direct-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Native Windows x64 / direct clang++
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Explicit pinned dependency provisioning
        run: call build.bat deps --fetch
      - name: Native SDK compiler linker and dependency doctor
        run: call build.bat doctor --verbose
      - name: Debug from fresh checkout
        run: call build.bat debug --verbose
      - name: Direct Debug tests and real Windows window
        run: call build.bat test debug --native-ui
      - name: Release compile
        run: call build.bat release --verbose
      - name: Direct Release tests and real Windows window
        run: call build.bat test release --native-ui
      - name: Native memory regressions
        run: call build.bat test asan --native-ui
      - name: Native libFuzzer smoke
        run: call build.bat fuzz
      - name: Failure propagation and stale-output regression
        run: call build.bat selftest
      - name: Remove generated outputs
        run: call build.bat clean
      - name: Native Release rebuild tests and portable ZIP
        run: call build.bat package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: direct-windows-evidence
          path: |
            out/windows/logs/
            out/windows/**/*.log
            out/windows/**/test-summary.txt
            out/windows/**/SDL3-runtime-dependencies.txt
            out/windows/**/embedded.manifest
            out/windows/**/desktop*.bmp
            out/windows/packages/*.zip
          retention-days: 14
  linux:
    name: Native Linux x64 / direct clang++
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize native OS development and display environment
        run: sudo apt-get update && sudo apt-get install -y clang libx11-dev libxext-dev xvfb xauth
      - name: Explicit pinned dependency provisioning
        run: ./build.sh deps --fetch
      - name: Native compiler linker and dependency doctor
        run: ./build.sh doctor --verbose
      - name: ASan UBSan memory regressions
        run: xvfb-run -a ./build.sh test asan --native-ui
      - name: Debug from fresh checkout
        run: ./build.sh debug --verbose
      - name: Direct Debug tests and X11 window
        run: xvfb-run -a ./build.sh test debug --native-ui
      - name: Release compile
        run: ./build.sh release --verbose
      - name: Direct Release tests and X11 window
        run: xvfb-run -a ./build.sh test release --native-ui
      - name: libFuzzer smoke
        run: ./build.sh fuzz
      - name: Failure propagation and stale-output regression
        run: ./build.sh selftest
      - name: Remove generated outputs
        run: ./build.sh clean
      - name: Native Release rebuild tests and portable TGZ
        run: xvfb-run -a ./build.sh package --native-ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: direct-linux-evidence
          path: |
            out/linux/logs/
            out/linux/**/*.log
            out/linux/**/test-summary.txt
            out/linux/packages/runtime-dependencies.txt
            out/linux/**/desktop*.bmp
            out/linux/packages/*.tar.gz
          retention-days: 14
