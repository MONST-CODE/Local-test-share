<!--
  DevLink — wordmark « DevLink » (mandat §14 : le mot est un wordmark à part
  entière, jamais une partie illisible de l'icône).

  Lettres construites en tracés vectoriels géométriques (aucune police, aucune
  dépendance de rendu) : capitales 120 u, hauteur d'x 76 u, graisse 18 u,
  terminaisons et jointures arrondies — cohérent avec les 18 u du D du symbole.
  Couleur : texte principal DevDark (#F5E9DC). Sur fond clair, utiliser
  #453329 (rôle texte principal DevLight).

  Interdits : déformer (étirement non uniforme), changer la graisse au hasard,
  ajouter un contour, une ombre ou un dégradé, remplacer par une police système.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="734" height="240" viewBox="0 0 734 240">
  <g fill="none" stroke="#F5E9DC" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
